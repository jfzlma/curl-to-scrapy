<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>curl-to-scrapy</title>
  <meta name="description" content="Free, open-source converter from curl commands to Scrapy shell and spider code. Runs entirely in your browser.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕷️</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>curl<span>-to-</span>scrapy</h1>
      <p>Paste a curl command, get Scrapy code for the shell and for your spider.</p>
    </div>
    <nav>
      <span class="badge" title="Nothing you paste is sent anywhere">100% client-side</span>
      <a href="https://github.com/jfzlma/curl-to-scrapy" class="source-link" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
        Source
      </a>
    </nav>
  </header>

  <main>
    <section class="panel input-panel">
      <div class="panel-head">
        <label for="curl-input">curl command</label>
        <div class="actions">
          <select id="examples" aria-label="Load an example">
            <option value="">Load example…</option>
            <option value="get">GET with headers &amp; cookies</option>
            <option value="form">POST form (urlencoded)</option>
            <option value="json">POST JSON</option>
            <option value="cmd">Chrome “Copy as cURL (cmd)”</option>
          </select>
          <button type="button" id="clear" class="ghost">Clear</button>
        </div>
      </div>
      <textarea id="curl-input" spellcheck="false" autocomplete="off" placeholder="curl 'https://example.com/api' -H 'accept: application/json' ...&#10;&#10;Tip: in DevTools → Network, right-click a request → Copy → Copy as cURL"></textarea>

      <div class="options">
        <fieldset id="class-picker" hidden>
          <legend>Request class</legend>
          <div class="segmented" role="radiogroup">
            <label><input type="radio" name="cls" value="Request" checked><span>Request</span></label>
            <label><input type="radio" name="cls" value="FormRequest"><span>FormRequest</span></label>
            <label><input type="radio" name="cls" value="JsonRequest"><span>JsonRequest</span></label>
          </div>
          <p class="hint" id="class-hint"></p>
        </fieldset>

        <fieldset>
          <legend>Options</legend>
          <label class="check"><input type="checkbox" id="opt-cookies" checked> Cookies as <code>cookies={}</code> dict</label>
          <label class="check"><input type="checkbox" id="opt-managed" checked> Drop headers Scrapy manages (<code>Host</code>, <code>Connection</code>, <code>Accept-Encoding</code>)</label>
          <label class="check"><input type="checkbox" id="opt-async"> Use <code>async def start()</code> (Scrapy 2.13+)</label>
          <label class="check"><input type="checkbox" id="opt-dontfilter"> Add <code>dont_filter=True</code></label>
        </fieldset>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <section class="outputs">
      <article class="panel">
        <div class="panel-head">
          <h2>Scrapy shell</h2>
          <button type="button" class="copy" data-target="out-shell">Copy</button>
        </div>
        <pre><code id="out-shell" class="py"></code></pre>
      </article>
      <article class="panel">
        <div class="panel-head">
          <h2>Spider <span class="muted" id="spider-file"></span></h2>
          <button type="button" class="copy" data-target="out-spider">Copy</button>
        </div>
        <pre><code id="out-spider" class="py"></code></pre>
      </article>
    </section>
  </main>

  <footer>
    MIT licensed · Your curl commands never leave this page (they often contain cookies and tokens).
  </footer>

  <script src="src/converter.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
